<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>User Management - EcoPulse Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{font-family:Inter, Arial, Helvetica, sans-serif; background:#f8f9fa}
    .card{border:0}
    .table td, .table th{vertical-align:middle}
    .small-muted{font-size:0.9rem;color:#6c757d}
  </style>
</head>
<body>
  <h1>User Management</h1>
  <p>List of registered users and role controls.</p>
  <div class="container py-4">
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h3 class="card-title">User Management</h3>
        <p class="text-muted mb-3">Only an administrator can invite users or change their roles. Existing role permissions remain enforced by the application.</p>

        <form id="invite-form" class="row g-2 align-items-end mb-4">
          <div class="col-md-3">
            <label class="form-label">Username</label>
            <input class="form-control" name="username" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Email</label>
            <input class="form-control" name="email" type="email" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Role</label>
            <select class="form-select" name="role" required>
              <option value="">Select role</option>
              <option value="admin">System Admin</option>
              <option value="examiner">Examiner</option>
              <option value="hr_manager">HR Manager</option>
              <option value="subadmin">Subadmin</option>
              <option value="customer">Customer</option>
            </select>
          </div>
          <div class="col-md-3 staff-identity-field">
            <label class="form-label">Full Names</label>
            <input class="form-control" name="full_name">
          </div>
          <div class="col-md-3 staff-identity-field">
            <label class="form-label">ID No.</label>
            <input class="form-control" name="id_number">
          </div>
          <div class="col-md-3">
            <label class="form-label">Phone Number</label>
            <input class="form-control" name="phone_number" type="tel">
          </div>
          <div class="col-12 d-flex align-items-center gap-3">
            <button type="submit" class="btn btn-success">Create invitation</button>
            <span class="small" id="invite-status" role="status"></span>
          </div>
        </form>

        <form id="assign-form" class="row g-2 align-items-end mb-3">
          <div class="col-md-5">
            <label class="form-label">Username</label>
            <input class="form-control" name="username" placeholder="Existing username" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">New Role</label>
            <select class="form-select" name="role" required>
              <option value="">Select role</option>
              <option value="examiner">Examiner</option>
              <option value="hr_manager">HR Manager</option>
              <option value="admin">System Admin</option>
              <option value="subadmin">Subadmin</option>
              <option value="customer">Customer</option>
            </select>
          </div>
          <div class="col-md-3 text-end">
            <button type="submit" class="btn btn-primary">Assign Role</button>
            <div class="small text-success mt-1" id="assign-status"></div>
          </div>
        </form>

        <div class="table-responsive">
          <table class="table table-striped table-hover">
            <thead>
              <tr>
                <th>ID</th>
                <th>Full Names</th>
                <th>Username</th>
                <th>Employee ID</th>
                <th>ID No.</th>
                <th>Email</th>
                <th>Role</th>
                <th>Actions</th>
                <th>Phone</th>
              </tr>
            </thead>
            <tbody id="users-tbody">
              <tr><td colspan="9" class="text-center">Loading users...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    const allowedRoles = ['admin','examiner','hr_manager','subadmin','customer'];
    const staffRoles = ['admin','examiner','hr_manager','subadmin'];
    const inviteForm = document.getElementById('invite-form');
    const inviteRole = inviteForm.elements.role;
    const inviteIdentityFields = inviteForm.querySelectorAll('.staff-identity-field');
    const inviteFullName = inviteForm.elements.full_name;
    const inviteIdNumber = inviteForm.elements.id_number;
    const invitePhone = inviteForm.elements.phone_number;

    function updateInviteFields(){
      const isStaff = staffRoles.includes(inviteRole.value);
      inviteIdentityFields.forEach(field => field.classList.toggle('d-none', !isStaff));
      inviteFullName.required = isStaff;
      inviteIdNumber.required = isStaff;
      invitePhone.required = isStaff;
    }

    inviteRole.addEventListener('change', updateInviteFields);
    updateInviteFields();

    inviteForm.addEventListener('submit', async (event)=>{
      event.preventDefault();
      const status = document.getElementById('invite-status');
      status.textContent = 'Creating invitation...';
      const payload = Object.fromEntries(new FormData(event.currentTarget).entries());
      const res = await fetch('/api/admin/users/invite', {
        method:'POST',
        headers:{'Content-Type':'application/json','Accept':'application/json'},
        body:JSON.stringify(payload)
      });
      const data = await res.json().catch(()=>({error:'Unable to create invitation'}));
      if(!res.ok){ status.textContent = data.error || 'Unable to create invitation'; return }
      status.replaceChildren(document.createTextNode('Share this setup link (expires in 24 hours): '));
      const link = document.createElement('a');
      link.href = data.invite_url;
      link.textContent = data.invite_url;
      link.target = '_blank';
      link.rel = 'noopener';
      status.appendChild(link);
      event.currentTarget.reset();
      updateInviteFields();
      fetchUsers();
    });

    async function fetchUsers(){
      const res = await fetch('/admin/users', {headers:{'Accept':'application/json'}});
      if(!res.ok){ document.getElementById('users-tbody').innerHTML='<tr><td colspan=9 class="text-danger">Error loading users</td></tr>'; return }
      const users = await res.json();
      const rows = users.map(u=>`<tr>
        <td>${u.id}</td>
        <td>${u.full_name || ''}</td>
        <td>${u.username || ''}</td>
        <td>${u.employee_id || ''}</td>
        <td>${u.id_number || ''}</td>
        <td>${u.email || ''}</td>
        <td>
          <select class="form-select role-select" data-user-id="${u.id}">
            ${allowedRoles.map(role => `<option value="${role}" ${role===u.role?'selected':''}>${role.replace('_',' ').replace(/\b\w/g, c => c.toUpperCase())}</option>`).join('')}
          </select>
        </td>
        <td><button type="button" class="btn btn-sm btn-outline-primary btn-assign" data-user-id="${u.id}">Save</button></td>
        <td>${u.phone || ''}</td>
      </tr>`).join('');
      document.getElementById('users-tbody').innerHTML = rows || '<tr><td colspan=9 class="text-center">No users</td></tr>';
      attachAssignHandlers();
    }

    function attachAssignHandlers(){
      document.querySelectorAll('.btn-assign').forEach(btn=>{
        btn.addEventListener('click', async (ev)=>{
          const id = ev.currentTarget.dataset.userId;
          const select = document.querySelector(`.role-select[data-user-id="${id}"]`);
          const role = select.value;
          const formData = new FormData();
          formData.append('role', role);
          const res = await fetch(`/admin/users/${id}/role`, {method:'POST', body: formData});
          if(res.ok){
            const data = await res.json();
            alert(`Role updated to ${data.role} for ${data.username}`);
            fetchUsers();
          } else {
            const error = await res.json().catch(()=>({error:'Unknown error'}));
            alert('Could not update role: ' + (error.error || error.message || 'Unknown'));
          }
        });
      });
    }

    document.getElementById('assign-form').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const form = e.target;
      const username = form.username.value.trim();
      const role = form.role.value;
      if(!username || !role){ return }
      const res = await fetch('/admin/users', {headers:{'Accept':'application/json'}});
      if(!res.ok){ alert('Unable to load users.'); return }
      const users = await res.json();
      const user = users.find(u => u.username.toLowerCase()===username.toLowerCase());
      if(!user){ alert('User not found. Use an existing username.'); return }
      const formData = new FormData();
      formData.append('role', role);
      const roleRes = await fetch(`/admin/users/${user.id}/role`, {method:'POST', body: formData});
      if(roleRes.ok){
        document.getElementById('assign-status').textContent = 'Role assigned';
        form.reset();
        setTimeout(()=>document.getElementById('assign-status').textContent='', 3000);
        fetchUsers();
      } else {
        const error = await roleRes.json().catch(()=>({error:'Unknown error'}));
        alert('Assignment failed: ' + (error.error || error.message || 'Unknown'));
      }
    });

    fetchUsers();
  </script>
</body>
</html>
