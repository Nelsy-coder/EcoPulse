<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Payroll Admin - EcoPulse</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;margin:20px}
    .card{border:1px solid #ddd;padding:12px;margin-bottom:12px;border-radius:6px}
    table{width:100%;border-collapse:collapse}
    th,td{padding:8px;border-bottom:1px solid #eee;text-align:left}
    .btn{display:inline-block;padding:6px 10px;background:#2b6cb0;color:#fff;border-radius:4px;text-decoration:none}
    .btn-approve{background:#38a169}
  </style>
</head>
<body>
  <h1>Payroll Administration</h1>
  <p>Create payroll runs and review pending records.</p>
  <div class="card">
    <form id="payroll-form">
      <label>Employee ID: <input name="employee_id" required></label>
      <label>Amount: <input name="amount" required type="number" step="0.01"></label>
      <button type="submit" class="btn">Create Payroll</button>
    </form>
  </div>
  <div class="card">
    <h3>Pending Payroll</h3>
    <table>
      <thead><tr><th>ID</th><th>Employee</th><th>Amount</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody id="payroll-tbody"></tbody>
    </table>
  </div>

  <script>
    document.getElementById('payroll-form').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const fd = new FormData(e.target);
      const body = {employee_id: fd.get('employee_id'), amount: parseFloat(fd.get('amount'))};
      const res = await fetch('/hr/payroll', {method:'POST', headers:{'Content-Type':'application/json','Accept':'application/json'}, body: JSON.stringify(body)});
      if(res.ok){ fetchPayroll(); e.target.reset(); } else { alert('Create failed') }
    });

    async function fetchPayroll(){
      const res = await fetch('/hr/payroll', {headers:{'Accept':'application/json'}});
      if(!res.ok){ document.getElementById('payroll-tbody').innerHTML='<tr><td colspan=5>Error loading</td></tr>'; return }
      const list = await res.json();
      const rows = list.map(p=>`<tr><td>${p.id}</td><td>${p.employee_name||p.employee_id}</td><td>${p.amount}</td><td>${p.status}</td><td>${p.status==='pending'?'<button type="button" class="btn btn-approve" data-id="'+p.id+'">Approve</button>':''}</td></tr>`).join('');
      document.getElementById('payroll-tbody').innerHTML = rows || '<tr><td colspan=5>No records</td></tr>';
      // attach approve handlers
      document.querySelectorAll('.btn-approve').forEach(btn=>{
        btn.addEventListener('click', async (ev)=>{
          const id = ev.currentTarget.getAttribute('data-id');
          const res = await fetch('/examiner/payroll/'+id+'/approve', {method:'POST', headers:{'Accept':'application/json'}});
          if(res.ok){ fetchPayroll(); } else if(res.status===403){ alert('Not authorized to approve payroll (examiner role required)') } else { alert('Approve failed') }
        })
      })
    }
    fetchPayroll();
  </script>
</body>
</html>
