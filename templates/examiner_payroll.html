<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Examiner Payroll Approvals - EcoPulse</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <style>
    body{font-family:Arial,Helvetica,sans-serif;background:#f4f6fb;color:#1f2937;padding:20px}
    .page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
    .page-header h1{font-size:1.75rem;margin:0}
    .card{border:1px solid #dde3ed;border-radius:12px;background:#fff;box-shadow:0 8px 24px rgba(15,23,42,.05);margin-bottom:20px}
    .table thead th{border-bottom:2px solid #e2e8f0}
    .table tbody tr:hover{background:#f8fafc}
    .btn{border-radius:8px}
    .btn-approve{background:#10b981;border-color:#10b981}
  </style>
</head>
<body>
  <div class="page-header">
    <div>
      <h1>Payroll Approval Queue</h1>
      <p class="text-muted">Review and approve pending payroll submissions as an examiner.</p>
    </div>
    <div>
      <a class="btn btn-secondary" href="/examiner_dashboard">Back to Examiner Dashboard</a>
    </div>
  </div>

  <div class="card p-3 mb-4">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>ID</th>
            <th>Employee</th>
            <th>Period</th>
            <th>Gross Salary</th>
            <th>Deductions</th>
            <th>Net Amount</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="payroll-tbody">
          <tr><td colspan="8" class="text-muted text-center">Loading payroll records...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    async function fetchPayroll(){
      const res = await fetch('/examiner/payroll', {headers:{'Accept':'application/json'}});
      if(!res.ok){
        document.getElementById('payroll-tbody').innerHTML = '<tr><td colspan="8" class="text-danger text-center">Unable to load payroll data</td></tr>';
        return;
      }
      const list = await res.json();
      if(!Array.isArray(list) || list.length === 0){
        document.getElementById('payroll-tbody').innerHTML = '<tr><td colspan="8" class="text-muted text-center">No payroll records available.</td></tr>';
        return;
      }
      document.getElementById('payroll-tbody').innerHTML = list.map(p => `
        <tr>
          <td>${p.id}</td>
          <td>${p.employee_name || p.employee_id || 'Unknown'}</td>
          <td>${p.period}</td>
          <td>${p.gross_salary.toFixed(2)}</td>
          <td>${p.deductions.toFixed(2)}</td>
          <td>${p.net_salary.toFixed(2)}</td>
          <td>${p.status}</td>
          <td>${p.status === 'pending' ? `<button type="button" class="btn btn-sm btn-approve" data-id="${p.id}">Approve</button>` : ''}</td>
        </tr>
      `).join('');
      document.querySelectorAll('.btn-approve').forEach(btn => {
        btn.addEventListener('click', async (ev) => {
          const payrollId = ev.currentTarget.dataset.id;
          const approveRes = await fetch(`/examiner/payroll/${payrollId}/approve`, {method:'POST', headers:{'Accept':'application/json'}});
          if(approveRes.ok){
            await fetchPayroll();
            return;
          }
          if(approveRes.status === 403){
            alert('You are not authorized to approve payroll.');
          } else {
            const error = await approveRes.text();
            alert('Failed to approve payroll: ' + error);
          }
        });
      });
    }
    fetchPayroll();
  </script>
</body>
</html>
